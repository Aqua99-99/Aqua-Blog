# 메인 화면의 "이 블로그의 구성"에 표시되는 단계 목록이에요.
# status: done(완료) / current(진행 중) / planned(예정)
# post: 이 단계를 정리한 글이 생기면 주소를 적으세요. 이름에 링크가 걸려요.
- name: 글 작성
  cmd: hugo new posts/my-post.md
  detail: Hugo와 Markdown
  status: done
  post: /posts/first-post/
- name: 저장소
  cmd: git push origin main
  detail: GitHub
  status: current
- name: 자동 빌드
  cmd: hugo --gc --minify
  detail: GitHub Actions
  status: planned
- name: 저장
  cmd: aws s3 sync public/ s3://<bucket>
  detail: Amazon S3
  status: planned
- name: 배포와 HTTPS
  cmd: aws cloudfront create-invalidation
  detail: CloudFront, ACM
  status: planned
- name: 도메인
  cmd: aws route53 list-hosted-zones
  detail: Route 53
  status: planned
